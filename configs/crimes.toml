# Réglages du projet crimes — modifier ICI, jamais dans les notebooks.

[experiment]
seed = 510                      # graine aléatoire : mêmes résultats à chaque exécution

[data]
path = "Data/actes-criminels.csv"   # relatif à la racine du projet

[panel]
# Unité de modélisation : 1 PDQ × 1 semaine (lundi → dimanche)
lag_days = 14                   # les 14 derniers jours sont sous-déclarés : on les exclut
active_since = "2025-01-01"     # on garde les PDQ encore actifs depuis cette date…
min_acts = 100                  # …avec au moins ce nombre d'actes

[split]
# Découpage TEMPOREL (comme le prof)
train_end = "2023-01-01"        # train      : semaines avant 2023
validation_end = "2024-01-01"   # validation : année 2023
                                # test       : 2024 et après — FERMÉ jusqu'à la fin

[historique]
# Contrat v2 : on peut utiliser les semaines passées, mais seulement celles déjà consolidées.
horizon = 4                # écart entre la dernière semaine consolidée du fichier et la semaine prédite
lags = [4, 5, 52]          # il y a 4 semaines, 5 semaines, et la même semaine l'an passé
fenetres = [4, 12]         # moyennes des 4 et 12 dernières semaines consolidées

[comparaison]
premiere_annee = 2019
derniere_annee_choix = 2023
derniere_annee = 2026
tolerance_mae = 0.05       # actes par PDQ-semaine ; départage en faveur du plus simple
poids_moy_4 = 0.5          # le reste du poids va à moy_12
ridge_alpha = 10.0
seuil_hausse = 5.0         # actes au-dessus de la normale de 12 semaines
bootstrap_bloc_semaines = 8
bootstrap_repetitions = 2000
