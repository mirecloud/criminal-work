# Interface Streamlit : elle n'appelle que le Service crime-api.
# Un seul réplica : la session Streamlit vit dans le pod (websocket).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crime-ui
  namespace: ml510
  labels: {app: crime-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: crime-ui}
  template:
    metadata:
      labels: {app: crime-ui}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: ui
          image: ml520-registry:5000/crime-ui:0.1.0
          ports: [{name: http, containerPort: 8501}]
          env:
            - {name: CRIME_API_URL, value: "http://crime-api"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crime-ui
  namespace: ml510
spec:
  selector: {app: crime-ui}
  ports: [{name: http, port: 80, targetPort: http}]
