# API : prévision (modèle du notebook 04) + bilan (LLM + contrôles). Sans état : 2 réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crime-api
  namespace: ml510
  labels: {app: crime-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: crime-api}
  template:
    metadata:
      labels: {app: crime-api}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets: [{name: dockerhub}]   # identifiant Docker Hub (Secret créé à la main, voir 10-config.yaml)
      containers:
        - name: api
          image: mirecloud/crime-api:1.2.0
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: crime-llm}
            - secretRef: {name: crime-llm, optional: true}   # seulement si le vLLM exige une clé
          securityContext:              # rien à écrire hors de /tmp, aucun privilège
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: llm-ca, mountPath: /etc/llm-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          # ready = modèle chargé ; un pod sans modèle ne reçoit pas de trafic
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: llm-ca
          configMap: {name: crime-llm-ca, optional: true}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crime-api
  namespace: ml510
spec:
  selector: {app: crime-api}
  ports: [{name: http, port: 80, targetPort: http}]
