# Réglages du LLM. Le vLLM du homelab n'exige pas de clé : LLM_API_KEY vaut « aucune » (le client OpenAI en veut une).
# Si un jour il en exige une, créer le Secret crime-llm ; il remplace la valeur ci-dessous :
#   kubectl -n ml510 create secret generic crime-llm --from-literal=LLM_API_KEY=...
# Le certificat de l'autorité mirecloud va dans le ConfigMap crime-llm-ca :
#   kubectl -n ml510 create configmap crime-llm-ca --from-file=ca.crt=chemin/vers/mirecloud-ca.crt
# L'identifiant Docker Hub (utile si le dépôt mirecloud est privé) va dans le Secret dockerhub :
#   kubectl -n ml510 create secret docker-registry dockerhub --docker-username=mirecloud --docker-password=<token>
apiVersion: v1
kind: ConfigMap
metadata:
  name: crime-llm
  namespace: ml510
data:
  AI_MODEL: "warshanks/Huihui-Qwen3-14B-abliterated-v2-AWQ"
  LLM_BASE_URL: "https://vllm.mirecloud.com/v1"
  LLM_CA_FILE: "/etc/llm-ca/ca.crt"
  LLM_API_KEY: "aucune"
